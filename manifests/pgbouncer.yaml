# PgBouncer in front of the self-hosted Neon compute, terminating real TLS and
# real password auth for the outside world.
#
# The compute itself is trust-auth on loopback and md5-but-unauthenticated-by-
# design for the blog's purposes — it was never meant to be internet-facing on
# its own. This is the actual security boundary: a client outside the cluster
# gets TLS + a real password check here; the plaintext hop from here to the
# compute stays inside the cluster's private pod network (ClusterIP), which is
# the same shape managed Neon's own pooler uses.
#
# Apply order: this ConfigMap has no secret in it. The Secret (TLS cert/key +
# userlist.txt) is generated by scripts/generate-pgbouncer-secret.sh and
# applied separately — never committed, since userlist.txt's md5 hashes are
# password-equivalent for Postgres auth.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-config
  namespace: neon
data:
  pgbouncer.ini: |
    [databases]
    odoo = host=odoo-main-postgres.neon.svc.cluster.local port=55433 dbname=odoo
    postgres = host=odoo-main-postgres.neon.svc.cluster.local port=55433 dbname=postgres
    * = host=odoo-main-postgres.neon.svc.cluster.local port=55433

    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = 5432
    auth_type = md5
    auth_file = /etc/pgbouncer/userlist.txt
    admin_users = provisioner

    ; Session pooling, not transaction: this fronts a general-purpose Odoo/psql
    ; client, and transaction pooling breaks session state (advisory locks,
    ; LISTEN/NOTIFY, SET) in ways that would surface as confusing bugs mid-demo
    ; rather than at setup time.
    pool_mode = session
    max_client_conn = 200
    default_pool_size = 25

    ; The whole point: real TLS to the outside world, not the trust auth the
    ; compute itself uses on loopback. The backend hop stays plaintext because
    ; it never leaves the cluster (ClusterIP, private pod network).
    client_tls_sslmode = require
    client_tls_key_file = /etc/pgbouncer/tls.key
    client_tls_cert_file = /etc/pgbouncer/tls.crt
    server_tls_sslmode = disable

    ignore_startup_parameters = extra_float_digits,options

    logfile = /dev/stdout
    pidfile = /tmp/pgbouncer.pid
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: neon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgbouncer
  template:
    metadata:
      labels:
        app: pgbouncer
    spec:
      containers:
        - name: pgbouncer
          # Pin exact tags — "1.20.1-p2" doesn't exist and cost a debug cycle;
          # verify against https://hub.docker.com/r/edoburu/pgbouncer/tags
          # before changing this.
          image: edoburu/pgbouncer:v1.25.2-p0
          # The image's own entrypoint.sh tries to GENERATE pgbouncer.ini and
          # userlist.txt from DB_* env vars, and fails with "Permission denied"
          # writing over our read-only Secret-mounted files at the same paths.
          # Bypass it and exec pgbouncer directly against our own config.
          command: ["pgbouncer"]
          args: ["/etc/pgbouncer/pgbouncer.ini"]
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: config
              mountPath: /etc/pgbouncer/pgbouncer.ini
              subPath: pgbouncer.ini
            - name: tls
              mountPath: /etc/pgbouncer/tls.crt
              subPath: tls.crt
            - name: tls
              mountPath: /etc/pgbouncer/tls.key
              subPath: tls.key
            - name: tls
              mountPath: /etc/pgbouncer/userlist.txt
              subPath: userlist.txt
          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
      volumes:
        - name: config
          configMap:
            name: pgbouncer-config
        - name: tls
          secret:
            # Created by generate-pgbouncer-secret.sh, not by this file.
            secretName: pgbouncer-tls
---
# ServiceLB (klipper) binds this on every node's public IP via iptables DNAT —
# confirmed live: connecting to any of the three node public IPs on :5432
# reaches this Service, the same pattern already proven for Odoo (:8069) and
# the MinIO console (:9001).
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
  namespace: neon
spec:
  type: LoadBalancer
  selector:
    app: pgbouncer
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
